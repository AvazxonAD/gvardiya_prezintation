<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>O'zbekiston xaritasi — TADBIR-HISOB</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background: #0a1628;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: #e8e8e8;
        }

        .map-container {
            width: 800px;
            height: 500px;
            position: relative;
        }

        /* Region paths */
        .uz-region {
            fill: url(#regionGrad);
            stroke: #2a6f97;
            stroke-width: 1.5;
            stroke-linejoin: round;
            transition: all 0.3s ease;
            cursor: pointer;
            filter: url(#regionGlow);
        }

        .uz-region:hover {
            fill: #27ae60;
            stroke: #2ecc71;
            stroke-width: 2.5;
            filter: drop-shadow(0 0 12px rgba(39, 174, 96, 0.6));
        }

        /* Region labels */
        .region-label {
            fill: #e8e8e8;
            font-family: 'Inter', sans-serif;
            font-weight: 500;
            pointer-events: none;
            text-shadow: 0 1px 3px rgba(0,0,0,0.8);
        }

        /* Tooltip */
        #tooltip {
            position: absolute;
            opacity: 0;
            background: rgba(15, 29, 50, 0.95);
            border: 1px solid #2a6f97;
            backdrop-filter: blur(12px);
            color: #fff;
            padding: 14px 18px;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            z-index: 50;
            pointer-events: none;
            transition: opacity 0.2s ease;
            width: 240px;
        }

        #tooltip h4 {
            font-weight: 700;
            color: #38bdf8;
            border-bottom: 1px solid #1a3a5c;
            padding-bottom: 8px;
            margin-bottom: 8px;
            font-size: 13px;
        }

        .tt-row {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            padding: 3px 0;
        }

        .tt-row span:first-child { color: #8899aa; }
        .tt-row span:last-child { font-weight: 600; }
        .tt-green { color: #2ecc71; }
        .tt-rose { color: #f43f5e; }
    </style>
</head>

    <script>
        const regions = document.querySelectorAll('.uz-region');
        const tooltip = document.getElementById('tooltip');

        regions.forEach(region => {
            region.addEventListener('mousemove', (e) => {
                document.getElementById('tt-name').innerText = region.dataset.name;
                document.getElementById('tt-shartnoma').innerText = region.dataset.shartnoma;
                document.getElementById('tt-hisob').innerText = region.dataset.hisob;
                document.getElementById('tt-kelib').innerText = region.dataset.kelib;
                document.getElementById('tt-qolgan').innerText = region.dataset.qolgan;

                const rect = document.querySelector('.map-container').getBoundingClientRect();
                tooltip.style.left = (e.clientX - rect.left + 15) + 'px';
                tooltip.style.top = (e.clientY - rect.top + 15) + 'px';
                tooltip.style.opacity = '1';
            });

            region.addEventListener('mouseleave', () => {
                tooltip.style.opacity = '0';
            });
        });
    </script>
